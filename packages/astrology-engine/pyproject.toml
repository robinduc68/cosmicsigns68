[project]
name = "cosmic-astrology"
version = "0.1.0"
description = "Deterministic Vietnamese calendar + Tử Vi chart engine for Cosmic Signs"
requires-python = ">=3.12"
# tzdata is pinned as a real dependency, not left to the host OS: two machines
# must not silently disagree about what UTC offset Vietnam used in 1968.
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "mypy>=1.14.0", "ruff>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmic_astrology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Vietnamese copy legitimately uses en dashes and typographic punctuation.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true

# tzdata ships timezone data, not code. The only attribute we touch is
# ``__version__`` (recorded in each chart's audit trail), and shipping a stub
# package for one string is not worth it.
[[tool.mypy.overrides]]
module = ["tzdata"]
ignore_missing_imports = true

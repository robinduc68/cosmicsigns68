name: cosmic-signs

services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosmic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmic}
      POSTGRES_DB: ${POSTGRES_DB:-cosmic_signs}
    ports:
      - '${POSTGRES_PORT:-5436}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cosmic} -d ${POSTGRES_DB:-cosmic_signs}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Not used by the application yet — enabled with `--profile cache` so the
  # dependency exists in infrastructure before the first job queue needs it.
  redis:
    image: redis:7-alpine
    container_name: cosmic_redis
    restart: unless-stopped
    profiles: ['cache', 'full']
    ports:
      - '${REDIS_PORT:-6382}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cosmic_api
    restart: unless-stopped
    profiles: ['full']
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cosmic}:${POSTGRES_PASSWORD:-cosmic}@postgres:5432/${POSTGRES_DB:-cosmic_signs}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      CHART_ENGINE_STAGE: ${CHART_ENGINE_STAGE:-PREVIEW}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - '${API_PORT:-8100}:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cosmic_web
    restart: unless-stopped
    profiles: ['full']
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8100}
      NUXT_API_BASE_INTERNAL: http://api:8000
      PORT: 3000
    ports:
      - '${WEB_PORT:-3100}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:

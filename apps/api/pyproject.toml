[project]
name = "cosmic-api"
version = "0.1.0"
description = "Cosmic Signs backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "structlog>=24.4.0",
  "cosmic-astrology",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "httpx>=0.28.1",
  "ruff>=0.9.2",
  "mypy>=1.14.1",
  "aiosqlite>=0.20.0",
]

[tool.uv.sources]
cosmic-astrology = { path = "../../packages/astrology-engine", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
  "B008",   # FastAPI declares dependencies as argument defaults
  "RUF001", # Vietnamese copy legitimately uses typographic punctuation
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["N999", "E501"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true
disallow_untyped_decorators = false
exclude = "alembic/versions"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
